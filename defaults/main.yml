---
nextcloud_version: 20.0.2
nextcloud_destination: /var/www
nextcloud_dir_user: www-data
nextcloud_dir_group: www-data
# php.ini memory_limit parameter
nextcloud_php_memory_limit: 512M


# PHP packaging layout.
#
# nextcloud_php_packages: [] keeps the historical behaviour: the
# php{{ php_fpm_version }}-<ext> names used by Debian/Ubuntu and by Remi's
# SCL packages. On EL8/EL9 with the Remi MODULAR stream
# (dnf module enable php:remi-8.x), the running php-fpm reads /etc/php.ini
# and /etc/php.d, and the SCL packages are NOT loaded. There, use the
# unprefixed modular names (the default below) - detected automatically
# when /etc/php.d exists, or forced with nextcloud_php_modular.
#
# Override nextcloud_php_packages with an explicit list to take full control.
nextcloud_php_packages: []
# null = auto-detect (true when /etc/php.d exists), true/false = force.
nextcloud_php_modular: null
# Loaded php.ini for the non-modular layout. Empty = historical SCL path.
nextcloud_php_ini_path: ""

nextcloud_php_packages_modular:
  - "php"
  - "php-fpm"
  - "php-opcache"
  - "php-process"
  - "php-gd"
  - "php-intl"
  - "php-mbstring"
  - "php-mysqlnd"
  - "php-pgsql"
  - "php-xml"
  - "php-zip"
  - "php-gmp"
  - "php-bcmath"
  - "php-pecl-apcu"
  - "php-pecl-imagick-im7"

nextcloud_php_packages_legacy:
  - "php{{ php_fpm_version }}-fpm"
  - "php{{ php_fpm_version }}-curl"
  - "php{{ php_fpm_version }}-gd"
  - "php{{ php_fpm_version }}-imagick"
  - "php{{ php_fpm_version }}-intl"
  - "php{{ php_fpm_version }}-gmp"
  - "php{{ php_fpm_version }}-bcmath"
  - "php{{ php_fpm_version }}-mbstring"
  - "php{{ php_fpm_version }}-mysql"
  - "php{{ php_fpm_version }}-pgsql"
  - "php{{ php_fpm_version }}-xml"
  - "php{{ php_fpm_version }}-zip"

# Enable backups with the following variable
#
# nextcloud_backup:
#   destination_server: backups.example.org
#   retention: 7
#   pg:
#     pg_dump_binary: /usr/lib/postgresql/12/bin/pg_dump
#     host: localhost
#     port: 5432
#     dbname: nextcloud
#     username: nextcloud
#     password: nextcloud

# Enable OnlyOffice flush changes to disk hack
# uncomment the next line if you want to install a recurrent hack
# to flush onlyoffice changes to disk at regular intervals
# Hack taken from https://help.nextcloud.com/t/onlyoffice-data-loss/20586/5
#
# nextcloud_onlyoffice_force_flush_period: 240s

# Configure NC via ansible
# WARNING: EXPERT CONFIG ONLY
# WARNING: it is recommended to let the installer configure your NC install
#
# nextcloud_config:
#   instanceid: "'{{ vault_nextcloud_instance_id }}'"
#   version: "'{{ nextcloud_version }}.1'"
#   dbtype: "'pgsql'"
#   dbname: "'nextcloud'"
#   dbhost: "'127.0.0.1'"
#   dbport: "''"
#   dbtableprefix: "'oc_'"
#   dbuser: "'nextcloud'"
#   dbpassword: "'{{ vault_postgresql_nextcloud_password }}'"
