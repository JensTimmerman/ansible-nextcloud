---
name: "ci"
"on":
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  schedule:
    - cron: "0 3 * * *"

jobs:
  lint:
    name: "lint (production)"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"
      - name: "Set up Python"
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.11"
      - name: "Install tooling"
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core>=2.18,<2.19" ansible-lint yamllint
      - name: "yamllint"
        run: "yamllint ."
      - name: "PHP config template integrity"
        run: "python3 tests/check_config_template.py"
      - name: "ansible-lint (production profile)"
        run: "ansible-lint"

  molecule:
    name: "molecule (${{ matrix.scenario }})"
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        scenario: ["rocky9", "ubuntu2404"]
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"
      - name: "Set up Python"
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.11"
      - name: "Install tooling"
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core>=2.18,<2.19" molecule "molecule-plugins[docker]" ansible-lint
      - name: "Molecule test"
        run: "molecule test -s ${{ matrix.scenario }}"
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
