---
# https://docs.nextcloud.com/server/18/admin_manual/installation/source_installation.html#prerequisites-for-manual-installation
- name: "Detect the modular PHP layout (Remi module stream)"
  ansible.builtin.stat:
    path: "/etc/php.d"
  register: "nextcloud_php_d_dir"
  changed_when: false

- name: "Check whether a modular PHP stream is enabled"
  ansible.builtin.command:
    cmd: "dnf -qy module list --enabled php"
  register: "nextcloud_php_module"
  changed_when: false
  failed_when: false
  when: "ansible_os_family == 'RedHat'"

- name: "Choose the PHP package layout"
  ansible.builtin.set_fact:
    nextcloud_php_modular_effective: >-
      {{ nextcloud_php_modular if nextcloud_php_modular is not none
         else ((nextcloud_php_d_dir.stat.isdir | default(false)) or
               ('remi' in (nextcloud_php_module.stdout | default('')))) }}

- name: "Select the PHP package list"
  ansible.builtin.set_fact:
    nextcloud_php_packages_effective: >-
      {{ nextcloud_php_packages if nextcloud_php_packages | length > 0
         else (nextcloud_php_packages_modular
               if nextcloud_php_modular_effective | bool
               else nextcloud_php_packages_legacy) }}

- name: "Select the loaded php.ini path"
  ansible.builtin.set_fact:
    nextcloud_php_ini_effective: >-
      {{ nextcloud_php_ini_path if nextcloud_php_ini_path | length > 0
         else ('/etc/php.ini' if nextcloud_php_modular_effective | bool
               else '/etc/php/' ~ php_fpm_version ~ '/fpm/php.ini') }}

- name: "Install the PHP packages required by Nextcloud (RedHat)"  # noqa: package-latest
  ansible.builtin.dnf:
    name: "{{ nextcloud_php_packages_effective }}"
    state: "latest"
    update_cache: true
    # Never downgrade: when the repo/module metadata lags the installed
    # version (e.g. a security patch published on the primary before the
    # mirrors), dnf would otherwise align to the older module stream and
    # downgrade PHP. Fail/skip instead.
    allow_downgrade: false
  when: ansible_os_family == "RedHat"

- name: "Install the PHP packages required by Nextcloud (Debian)"
  ansible.builtin.apt:
    name: "{{ nextcloud_php_packages_effective }}"
    state: "present"
    update_cache: true
  when: ansible_os_family != "RedHat"

# Optional floor: fail loudly when the configured repositories do not offer
# the required (security) version instead of silently downgrading.
- name: "Read the installed PHP version"
  ansible.builtin.command:
    cmd: "php -r 'echo PHP_VERSION;'"
  register: "nextcloud_php_installed_version"
  changed_when: false
  when: "nextcloud_php_min_version | default('') | length > 0"

- name: "Assert the installed PHP meets nextcloud_php_min_version"
  ansible.builtin.assert:
    that:
      - "nextcloud_php_installed_version.stdout is version(nextcloud_php_min_version, '>=')"
    fail_msg: >-
      PHP {{ nextcloud_php_installed_version.stdout }} is older than
      nextcloud_php_min_version ({{ nextcloud_php_min_version }}). The
      configured repositories do not offer the newer package; the role will
      not downgrade. Wait for the repo/mirror to publish it and rerun.
    success_msg: "PHP {{ nextcloud_php_installed_version.stdout }} >= {{ nextcloud_php_min_version }}."
  when: "nextcloud_php_min_version | default('') | length > 0"

# unarchive (remote_src) needs tar plus bzip2 for the .tar.bz2 release.
# Minimal EL9 containers ship neither, and the task fails with
# "Unable to find required 'gtar' or 'tar' binary in the path".
- name: "Ensure archive tools are installed"
  ansible.builtin.package:
    name:
      - "tar"
      - "bzip2"
    state: "present"

- name: Make sure destination folder exists
  ansible.builtin.file:
    path: "{{ nextcloud_destination }}"
    state: directory
    owner: "{{ nextcloud_dir_user }}"
    group: "{{ nextcloud_dir_group }}"
    mode: "0755"

# Create the install directory before any consumer (e.g. a php-fpm role
# whose pool sets chdir) references it. unarchive would create it later,
# but other roles run first in a typical play.
- name: "Make sure the Nextcloud directory exists"
  ansible.builtin.file:
    path: "{{ nextcloud_destination }}/nextcloud"
    state: "directory"
    owner: "{{ nextcloud_dir_user }}"
    group: "{{ nextcloud_dir_group }}"
    mode: "0755"

- name: Check installed Nextcloud version
  ansible.builtin.command: grep "OC_VersionString" {{ nextcloud_destination }}/nextcloud/version.php
  register: installed_version
  failed_when: false
  changed_when: false

- name: "Set the upgrade and release archive facts"
  ansible.builtin.set_fact:
    nextcloud_is_upgrade: >-
      {{ (installed_version.stdout | default('') | trim | length > 0) and
         (nextcloud_version not in installed_version.stdout) }}
    nextcloud_release_archive: "{{ nextcloud_destination }}/nextcloud-{{ nextcloud_version }}.tar.bz2"

# unarchive merges over the existing tree, so files removed between majors
# persist. Compare the installed tree with the target release's file list
# FIRST (shipped.json still describes the installed major), delete what the
# release no longer ships, then extract. Opt-in via nextcloud_prune_stale.
- name: "Download the target release archive for stale-file pruning"
  ansible.builtin.get_url:
    url: "https://download.nextcloud.com/server/releases/nextcloud-{{ nextcloud_version }}.tar.bz2"
    dest: "{{ nextcloud_release_archive }}"
    mode: "0644"
  when:
    - nextcloud_prune_stale | bool
    - nextcloud_is_upgrade | bool

- name: "Download the release checksum"
  ansible.builtin.get_url:
    url: "https://download.nextcloud.com/server/releases/nextcloud-{{ nextcloud_version }}.tar.bz2.sha256"
    dest: "{{ nextcloud_release_archive }}.sha256"
    mode: "0644"
  when:
    - nextcloud_prune_stale | bool
    - nextcloud_is_upgrade | bool

- name: "Verify the release archive checksum"
  ansible.builtin.command:
    cmd: "sha256sum -c {{ nextcloud_release_archive | basename }}.sha256"
    chdir: "{{ nextcloud_destination }}"
  changed_when: false
  when:
    - nextcloud_prune_stale | bool
    - nextcloud_is_upgrade | bool

- name: "Prune files the target release no longer ships"
  ansible.builtin.script:
    cmd: >-
      prune_stale.py --root {{ nextcloud_destination }}/nextcloud
      --tarball {{ nextcloud_release_archive }}
      --max {{ nextcloud_stale_max_files }}
  register: "nextcloud_prune_result"
  changed_when: "(nextcloud_prune_result.stdout | from_json).removed | default(0) | int > 0"
  when:
    - nextcloud_prune_stale | bool
    - nextcloud_is_upgrade | bool

- name: "Report the stale files that were removed"
  ansible.builtin.debug:
    var: "nextcloud_prune_result.stdout | from_json"
  when: >-
    nextcloud_prune_result is defined and
    nextcloud_prune_result.stdout is defined and
    nextcloud_prune_result.stdout | length > 0

- name: Download nextcloud
  ansible.builtin.unarchive:
    src: >-
      {{ nextcloud_release_archive if (nextcloud_prune_stale | bool and nextcloud_is_upgrade | bool)
         else 'https://download.nextcloud.com/server/releases/nextcloud-' ~ nextcloud_version ~ '.tar.bz2' }}
    dest: "{{ nextcloud_destination }}"
    remote_src: true
    owner: "{{ nextcloud_dir_user }}"
    group: "{{ nextcloud_dir_group }}"
    mode: "0755"
  when: nextcloud_version not in installed_version.stdout

- name: "Remove the downloaded release archive"
  ansible.builtin.file:
    path: "{{ nextcloud_release_archive }}"
    state: "absent"
  when:
    - nextcloud_prune_stale | bool
    - nextcloud_is_upgrade | bool


# Repair a config.php that has bytes before `<?php`. Nextcloud's
# OC\Config::readData() rejects any leading content, so every occ command -
# including the `occ status` below - fails on such a file. Two role bugs could
# produce one: config.php.j2 emitted its ansible_managed comment before
# `<?php`, and the legacy nextcloud_config lineinfile can insert values at the
# top of an empty/invalid file. Strip everything before the first `<?php`
# BEFORE occ is used; otherwise nextcloud_is_installed is wrongly false and a
# fresh install is attempted over a corrupt file. config.php holds the DB
# password and instance secret, so every task reading or rewriting it is
# no_log.
- name: "Stat config.php before reading the installation state"
  ansible.builtin.stat:
    path: "{{ nextcloud_destination }}/nextcloud/config/config.php"
  register: "nextcloud_config_repair_stat"
  no_log: true

- name: "Read config.php for the leading-content repair"
  ansible.builtin.slurp:
    src: "{{ nextcloud_destination }}/nextcloud/config/config.php"
  register: "nextcloud_config_repair_slurp"
  no_log: true
  when: nextcloud_config_repair_stat.stat.exists | default(false)

- name: "Locate the PHP open tag in config.php"
  ansible.builtin.set_fact:
    nextcloud_config_php_offset: >-
      {{ (nextcloud_config_repair_slurp.content | b64decode).find('<?php')
         if (nextcloud_config_repair_stat.stat.exists | default(false))
         else -1 }}
  no_log: true

# A non-empty file without any `<?php` cannot be repaired by stripping bytes:
# there is no PHP document to keep, so fail loudly instead of guessing. A
# zero-byte file is the known "not installed yet" state - `occ status` is the
# source of truth there - so it is left untouched.
- name: "Fail when config.php has no PHP open tag and cannot be repaired"
  ansible.builtin.fail:
    msg: >-
      {{ nextcloud_destination }}/nextcloud/config/config.php exists but has
      no "<?php" open tag, so it cannot be repaired automatically. Restore it
      from a backup (or remove it for a fresh install) and rerun the role.
  when:
    - nextcloud_config_repair_stat.stat.exists | default(false)
    - nextcloud_config_php_offset | int < 0
    - (nextcloud_config_repair_slurp.content | b64decode) | length > 0

# Only strip; the leading bytes are discarded, never executed. backup: true
# keeps a timestamped config.php.*~ copy next to the file (Nextcloud ignores
# it). Idempotent: a file that already starts with `<?php` has offset 0 and
# is not rewritten.
- name: "Repair config.php by stripping content before the PHP open tag"
  ansible.builtin.copy:
    content: >-
      {{ (nextcloud_config_repair_slurp.content | b64decode)[nextcloud_config_php_offset | int :] }}
    dest: "{{ nextcloud_destination }}/nextcloud/config/config.php"
    owner: "{{ nextcloud_dir_user }}"
    group: "{{ nextcloud_dir_group }}"
    mode: "0640"
    backup: true
  no_log: true
  when:
    - nextcloud_config_repair_stat.stat.exists | default(false)
    - nextcloud_config_php_offset | int > 0

# Fresh install. Read the real state from occ (config.php may exist but be
# empty, so its presence is not a reliable signal). --output=json keeps
# stdout pure even when occ warns on stderr.
- name: "Read the Nextcloud installation state"
  ansible.builtin.command:
    cmd: "php occ status --output=json"
    chdir: "{{ nextcloud_destination }}/nextcloud"
  become: true
  become_user: "{{ nextcloud_dir_user }}"
  register: "nextcloud_status"
  changed_when: false
  failed_when: false

- name: "Determine whether Nextcloud is installed"
  ansible.builtin.set_fact:
    nextcloud_is_installed: >-
      {{ ((nextcloud_status.stdout | default('') | from_json).installed
          | default(false) | bool)
         if (nextcloud_status.stdout | default('') | trim) is match('^\{')
         else false }}

- name: "Warn when Nextcloud is not installed and automatic install is disabled"
  ansible.builtin.debug:
    msg: >-
      WARNING: Nextcloud reports installed=false and
      nextcloud_maintenance_install is false. Complete the web installer, or
      set nextcloud_maintenance_install: true with nextcloud_admin_password
      and the nextcloud_db_* variables to install from this role.
  when: not nextcloud_is_installed and not nextcloud_maintenance_install | bool

- name: "Validate the fresh-install inputs"
  ansible.builtin.assert:
    that:
      - "nextcloud_admin_password | length > 0"
      - "nextcloud_db_password | length > 0 or nextcloud_db_type == 'sqlite'"
    fail_msg: >-
      nextcloud_maintenance_install is true but the admin password is empty
      and/or the database password is empty (allowed only for sqlite).
    quiet: true
  when:
    - nextcloud_maintenance_install | bool
    - not nextcloud_is_installed

- name: "Install Nextcloud (fresh instance)"
  ansible.builtin.command:
    argv: >-
      {{ ['php', 'occ', 'maintenance:install',
          '--database=' ~ nextcloud_db_type,
          '--database-name=' ~ nextcloud_db_name,
          '--database-user=' ~ nextcloud_db_user,
          '--database-pass=' ~ nextcloud_db_password,
          '--admin-user=' ~ nextcloud_admin_user,
          '--admin-pass=' ~ nextcloud_admin_password,
          '--data-dir=' ~ nextcloud_data_dir]
         + (['--database-host=' ~ nextcloud_db_host]
            if nextcloud_db_type != 'sqlite' else []) }}
    chdir: "{{ nextcloud_destination }}/nextcloud"
  become: true
  become_user: "{{ nextcloud_dir_user }}"
  no_log: true
  changed_when: true
  when:
    - nextcloud_maintenance_install | bool
    - not nextcloud_is_installed

- name: Setup nextcloud cron to run every 5 minutes
  ansible.builtin.cron:
    name: "Nextcloud cron"
    minute: "*/5"
    user: "{{ nextcloud_dir_user }}"
    job: "/usr/bin/php -f {{ nextcloud_destination }}/nextcloud/cron.php"

# memory_limit: Nextcloud recommends at least 512M. The modular layout reads
# /etc/php.d, so write a drop-in there; the legacy layout is edited in place.
- name: "Configure the PHP memory limit (modular drop-in)"
  ansible.builtin.template:
    src: "php_memory_limit.ini.j2"
    dest: "/etc/php.d/10-nextcloud-memory.ini"
    owner: "root"
    group: "root"
    mode: "0644"
  when: nextcloud_php_modular_effective | bool

- name: "Check the php.ini path for the legacy layout"
  ansible.builtin.stat:
    path: "{{ nextcloud_php_ini_effective }}"
  register: "nextcloud_php_ini_stat"
  when: not nextcloud_php_modular_effective | bool

- name: "Configure the PHP memory limit in php.ini"
  ansible.builtin.lineinfile:
    path: "{{ nextcloud_php_ini_effective }}"
    regexp: '^memory_limit ='
    line: "memory_limit = {{ nextcloud_php_memory_limit }}"
  when:
    - not nextcloud_php_modular_effective | bool
    - nextcloud_php_ini_stat.stat.exists | default(false)

- name: Setup automatic daily backups
  ansible.builtin.include_tasks: backups.yml
  when: nextcloud_backup is defined

- name: Check config file status
  ansible.builtin.stat:
    path: "{{ nextcloud_destination }}/nextcloud/config/config.php"
  register: nextcloud_config_file
  no_log: true

- name: Create config file if it doesn't exist
  ansible.builtin.template:
    src: "config.php.j2"
    dest: "{{ nextcloud_destination }}/nextcloud/config/config.php"
    mode: "0640"
  no_log: true
  when:
    - nextcloud_config is defined
    - not nextcloud_config_file.stat.exists

# The legacy lineinfile inserts before the closing `);` line, so it must only
# run on a file that actually has one. The earlier repair already guarantees
# `<?php` is on line 1 or the run failed; this additionally skips a config
# that is absent or has no closing line, so the task can never append values
# after a broken array (or to the top of an empty file). This runs *after* the
# template above, so a config.php just created by it is still edited as before.
- name: "Check config.php has a closing config line before editing it"
  ansible.builtin.command:
    argv:
      - "grep"
      - "-qxF"
      - ");"
      - "{{ nextcloud_destination }}/nextcloud/config/config.php"
  register: "nextcloud_config_closing_line"
  changed_when: false
  failed_when: false
  no_log: true
  when: nextcloud_config is defined

- name: Configure Nextcloud installation
  ansible.builtin.lineinfile:
    path: "{{ nextcloud_destination }}/nextcloud/config/config.php"
    regexp: "^  '{{ item.key }}' => .*,$"
    line: "  '{{ item.key }}' => {{ item.value }},"
    insertbefore: '^\);$'
  loop: "{{ nextcloud_config | default({}) | dict2items }}"
  no_log: true
  when: nextcloud_config_closing_line.rc | default(1) | int == 0

# Typed trusted-domain/proxy lists applied via occ, AFTER the legacy
# nextcloud_config loop so the occ values win. Guarded so a run with all three
# lists empty performs no new tasks (no behaviour change for existing callers),
# and so a bare role run with no Nextcloud present stays a no-op: the occ
# config:system:* commands only exist once the instance is installed (or is
# being installed by this very run).
- name: "Apply the typed trusted-domain/proxy configuration via occ"
  ansible.builtin.include_tasks: trusted.yml
  when:
    - nextcloud_is_installed | default(false) or nextcloud_maintenance_install | bool
    - nextcloud_trusted_domains | length > 0 or
      nextcloud_trusted_proxies | length > 0 or
      nextcloud_forwarded_for_headers | length > 0

- name: OnlyOffice hack
  ansible.builtin.include_tasks: onlyoffice-hack.yml
