---
- name: "Converge (Rocky 9, modular PHP)"
  hosts: "all"
  # Molecule docker connects as root; sudo as root fails PAM on Rocky 9.
  become: false
  roles:
    - role: "nextcloud"
  vars:
    nextcloud_version: "35.0.2"
    nextcloud_destination: "/var/www"
    nextcloud_dir_user: "root"
    nextcloud_dir_group: "root"
    php_fpm_version: "84-php"
    nextcloud_config:
      trusted_domains: "['localhost', '127.0.0.1']"
