---
- name: "Verify (Rocky 9, modular PHP)"
  hosts: "all"
  # Molecule docker connects as root; sudo as root fails PAM on Rocky 9.
  become: false
  vars:
    # sudo as root fails PAM on Rocky 9; escalate with su instead.
    ansible_become_method: "su"
    nextcloud_dir_user: "root"
  tasks:
    - name: "Stat the Nextcloud version file"
      ansible.builtin.stat:
        path: "/var/www/nextcloud/version.php"
      register: "version_file"
    - name: "Assert the release was extracted"
      ansible.builtin.assert:
        that:
          - "version_file.stat.exists"
    - name: "Read the installed version"
      ansible.builtin.command:
        cmd: "grep OC_VersionString /var/www/nextcloud/version.php"
      register: "version_grep"
      changed_when: false
    - name: "Assert the target version"
      ansible.builtin.assert:
        that:
          - "'35.0.2' in version_grep.stdout"
    - name: "Stat the generated config.php"
      ansible.builtin.stat:
        path: "/var/www/nextcloud/config/config.php"
      register: "config_file"
    - name: "Assert config.php exists"
      ansible.builtin.assert:
        that:
          - "config_file.stat.exists"
    - name: "Read the generated config.php"
      ansible.builtin.slurp:
        src: "/var/www/nextcloud/config/config.php"
      register: "config_content"
      no_log: true
    - name: "Assert config.php starts with the PHP open tag"
      ansible.builtin.assert:
        that:
          - "(config_content.content | b64decode).startswith('<?php')"
    - name: "Find the backup created by the leading-content repair"
      ansible.builtin.find:
        paths: "/var/www/nextcloud/config"
        patterns: "config.php.*~"
      register: "config_repair_backups"
    # Proves the repair ran on the corrupt file seeded by prepare.yml (and was
    # not merely overwritten by the fresh install).
    - name: "Assert the leading-content repair backed up the corrupt config.php"
      ansible.builtin.assert:
        that:
          - "config_repair_backups.matched | int > 0"
    - name: "Read the modular php memory drop-in"
      ansible.builtin.slurp:
        src: "/etc/php.d/10-nextcloud-memory.ini"
      register: "memory_ini"
    - name: "Assert the memory limit is configured"
      ansible.builtin.assert:
        that:
          - "'512M' in (memory_ini.content | b64decode)"
    - name: "Read the root crontab"
      ansible.builtin.command:
        cmd: "crontab -l -u root"
      register: "root_cron"
      changed_when: false
      failed_when: false
    - name: "Assert the Nextcloud cron entry exists"
      ansible.builtin.assert:
        that:
          - "'nextcloud/cron.php' in root_cron.stdout"
    - name: "Read the configured trusted domains via occ"
      ansible.builtin.command:
        argv: ["php", "occ", "config:system:get", "trusted_domains", "--output=json"]
        chdir: "/var/www/nextcloud"
      become: true
      become_user: "{{ nextcloud_dir_user }}"
      register: "occ_trusted_domains"
      changed_when: false
    - name: "Assert the trusted domains were applied"
      ansible.builtin.assert:
        that:
          - "(occ_trusted_domains.stdout | from_json) == ['localhost', '127.0.0.1']"
        quiet: true
    - name: "Read the configured trusted proxies via occ"
      ansible.builtin.command:
        argv: ["php", "occ", "config:system:get", "trusted_proxies", "--output=json"]
        chdir: "/var/www/nextcloud"
      become: true
      become_user: "{{ nextcloud_dir_user }}"
      register: "occ_trusted_proxies"
      changed_when: false
    - name: "Assert the trusted proxies were applied"
      ansible.builtin.assert:
        that:
          - "(occ_trusted_proxies.stdout | from_json) == ['10.0.0.1']"
        quiet: true
    - name: "Read the configured forwarded-for headers via occ"
      ansible.builtin.command:
        argv: ["php", "occ", "config:system:get", "forwarded_for_headers", "--output=json"]
        chdir: "/var/www/nextcloud"
      become: true
      become_user: "{{ nextcloud_dir_user }}"
      register: "occ_forwarded_for_headers"
      changed_when: false
    - name: "Assert the forwarded-for headers were applied"
      ansible.builtin.assert:
        that:
          - "(occ_forwarded_for_headers.stdout | from_json) == ['HTTP_X_FORWARDED_FOR']"
        quiet: true
