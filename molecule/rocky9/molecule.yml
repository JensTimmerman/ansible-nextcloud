---
dependency:
  name: "shell"
  command: "ansible-galaxy install -r ../../requirements.yml"
driver:
  name: "docker"
platforms:
  - name: "instance"
    image: "geerlingguy/docker-rockylinux9-ansible:latest"
    command: "/usr/sbin/init"
    privileged: true
    volumes:
      - "/sys/fs/cgroup:/sys/fs/cgroup:rw"
    cgroupns_mode: "host"
    pre_build_image: true
provisioner:
  name: "ansible"
  lint: "true"
scenario:
  name: "rocky9"
verifier:
  name: "ansible"
