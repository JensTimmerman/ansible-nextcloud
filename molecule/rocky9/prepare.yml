---
- name: "Prepare (Rocky 9 + Remi modular PHP)"
  hosts: "all"
  # Molecule docker connects as root; sudo as root fails PAM on Rocky 9.
  become: false
  tasks:
    # remirepo mirrors are occasionally slow or drop TLS handshakes on CI
    # runners. Make dnf itself retry, for every later dnf call too.
    - name: "Set dnf retries and timeouts"
      ansible.builtin.lineinfile:
        path: "/etc/dnf/dnf.conf"
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
      loop:
        - {key: "retries", value: "10"}
        - {key: "timeout", value: "60"}

    - name: "Install the Remi release package"
      ansible.builtin.dnf:
        name: "https://rpms.remirepo.net/enterprise/remi-release-9.rpm"
        state: "present"
        disable_gpg_check: true
      register: "remi_release_install"
      retries: 5
      delay: 20
      until: "remi_release_install is succeeded"
    # dnf's mirrorlist for Remi has produced 404s and stalled RPM downloads
    # on CI runners. Pin the repos to the canonical host that serves the
    # release RPM (also reachable from the runner).
    - name: "Point the Remi repositories at the canonical server"
      ansible.builtin.command:
        cmd: >-
          dnf -y config-manager --save
          --setopt=remi.baseurl=https://rpms.remirepo.net/enterprise/9/remi/x86_64/
          --setopt=remi-modular.baseurl=https://rpms.remirepo.net/enterprise/9/modular/x86_64/
          --setopt=remi-safe.baseurl=https://rpms.remirepo.net/enterprise/9/safe/x86_64/
      register: "remi_baseurl"
      changed_when: false
      retries: 3
      delay: 10
      until: "remi_baseurl.rc == 0"

    - name: "Reset the php module"
      ansible.builtin.command:
        cmd: "dnf -y --setopt=retries=5 --setopt=timeout=30 module reset php"
      register: "php_module_reset"
      changed_when: false
      retries: 4
      delay: 15
      until: "php_module_reset.rc == 0"

    - name: "Enable php:remi-8.4"
      ansible.builtin.command:
        cmd: "dnf -y --setopt=retries=5 --setopt=timeout=30 module enable php:remi-8.4"
      register: "php_module_enable"
      changed_when: false
      retries: 4
      delay: 15
      until: "php_module_enable.rc == 0"
    - name: "Install base tools"
      ansible.builtin.dnf:
        name:
          - "tar"
          - "bzip2"
          - "sudo"
          - "cronie"
        state: "present"
      register: "base_tools_install"
      retries: 5
      delay: 20
      until: "base_tools_install is succeeded"
