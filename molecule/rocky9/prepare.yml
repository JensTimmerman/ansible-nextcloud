---
- name: "Prepare (Rocky 9 + Remi modular PHP)"
  hosts: "all"
  # Molecule docker connects as root; sudo as root fails PAM on Rocky 9.
  become: false
  tasks:
    # remirepo mirrors are occasionally slow or drop TLS handshakes on CI
    # runners. Make dnf itself retry, for every later dnf call too.
    - name: "Set dnf retries and timeouts"
      ansible.builtin.lineinfile:
        path: "/etc/dnf/dnf.conf"
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
      loop:
        - {key: "retries", value: "10"}
        - {key: "timeout", value: "60"}
        - {key: "fastestmirror", value: "True"}

    - name: "Install the Remi release package"
      ansible.builtin.dnf:
        name: "https://rpms.remirepo.net/enterprise/remi-release-9.rpm"
        state: "present"
        disable_gpg_check: true
      register: "remi_release_install"
      retries: 5
      delay: 20
      until: "remi_release_install is succeeded"
    # The 2026-10-21 PHP emergency release (PHP2Shell) overloaded the Remi
    # primary; fastestmirror uses the mirrorlist instead. Refresh once, with
    # retries, before the module commands.
    - name: "Refresh dnf metadata"
      ansible.builtin.command:
        cmd: "dnf -y --setopt=fastestmirror=True makecache --refresh"
      register: "dnf_makecache"
      changed_when: false
      retries: 4
      delay: 30
      until: "dnf_makecache.rc == 0"

    - name: "Reset the php module"
      ansible.builtin.command:
        cmd: "dnf -y --setopt=retries=5 --setopt=timeout=30 module reset php"
      register: "php_module_reset"
      changed_when: false
      retries: 4
      delay: 15
      until: "php_module_reset.rc == 0"

    - name: "Enable php:remi-8.4"
      ansible.builtin.command:
        cmd: "dnf -y --setopt=retries=5 --setopt=timeout=30 module enable php:remi-8.4"
      register: "php_module_enable"
      changed_when: false
      retries: 4
      delay: 15
      until: "php_module_enable.rc == 0"
    - name: "Install base tools"
      ansible.builtin.dnf:
        name:
          - "tar"
          - "bzip2"
          - "sudo"
          - "cronie"
        state: "present"
      register: "base_tools_install"
      retries: 5
      delay: 20
      until: "base_tools_install is succeeded"

    # Regression: seed a config.php whose legacy nextcloud_config values sit
    # BEFORE `<?php`, exactly like the QA host that failed `occ upgrade` with
    # "Config file has leading content". The role must repair it before its
    # first occ call and leave a config.php.*~ backup behind (asserted in
    # verify.yml), otherwise the fresh install fails.
    - name: "Create the config directory for the repair regression"
      ansible.builtin.file:
        path: "/var/www/nextcloud/config"
        state: "directory"
        mode: "0755"

    - name: "Seed config.php with leading content (regression)"
      ansible.builtin.copy:
        dest: "/var/www/nextcloud/config/config.php"
        content: |
          'trusted_domains' => array('old.example.org'),
          'trusted_proxies' => array('10.0.0.9'),
          'forwarded_for_headers' => array('HTTP_X_FORWARDED_FOR'),
          <?php
          $CONFIG = array (
          );
        owner: "root"
        group: "root"
        mode: "0640"
