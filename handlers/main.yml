---
- name: "Force systemd to reread config"
  ansible.builtin.systemd:
    daemon_reload: true
  listen: "Enable and start service"

- name: Enable OO hack service
  ansible.builtin.systemd:
    name: onlyoffice
    enabled: true
  listen: "Enable and start service"

- name: Start OO hack service
  ansible.builtin.systemd:
    name: onlyoffice
    state: started
  listen: "Enable and start service"
